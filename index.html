<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="古文漢文">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#22395E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>古文漢文ドリル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app shell — 藍染(indigo) header band, washi-white sheets, gold for progress; bottom tab bar */
:root{
  --bg:#EEF1EE; --sheet:#FBFCFA; --ink:#1B2230; --sub:#5A6474; --line:#D6DCD8;
  --ai:#22395E; --ai-soft:#DCE4F0; --kin:#B9861F; --kin-soft:#F3E7C8;
  --ok:#2F7A55; --ok-soft:#DCEFE4; --ng:#A8343B; --ng-soft:#F6DEDF;
  --onai:#F5F2E8;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --goth:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1522; --sheet:#162133; --ink:#E5E8EE; --sub:#9AA5B6; --line:#2A3850;
  --ai:#9DB8E4; --ai-soft:#22324C; --kin:#E2B75A; --kin-soft:#3A3220;
  --ok:#6CC69A; --ok-soft:#173527; --ng:#EE8A8F; --ng-soft:#3E1F24; --onai:#0E1522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1522; --sheet:#162133; --ink:#E5E8EE; --sub:#9AA5B6; --line:#2A3850;
  --ai:#9DB8E4; --ai-soft:#22324C; --kin:#E2B75A; --kin-soft:#3A3220;
  --ok:#6CC69A; --ok-soft:#173527; --ng:#EE8A8F; --ng-soft:#3E1F24; --onai:#0E1522; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--goth);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ai)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ai);color:var(--onai)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:10px;gap:12px}
.brand{font-family:var(--mincho);font-weight:800;font-size:1.3rem;letter-spacing:.08em}
.brand small{font-family:var(--goth);font-weight:500;font-size:.7rem;letter-spacing:.05em;opacity:.8;margin-left:6px}
header.top .grades{gap:6px;padding-block:0 10px;justify-content:stretch}
.grades button{flex:1;border:1px solid rgba(128,128,128,.55);background:transparent;color:var(--onai);border-radius:999px;padding:3px 0;font-weight:700;font-size:.85rem;cursor:pointer}
.grades button[aria-pressed="true"]{background:var(--onai);color:var(--ai);border-color:var(--onai)}
.gchip{font-size:.7rem;font-weight:700;color:var(--kin);margin-left:auto;margin-right:8px;white-space:nowrap}
.streak{font-size:.8rem;font-weight:700;background:rgba(128,128,128,.22);padding:3px 10px;border-radius:999px;white-space:nowrap}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-top:18px;padding-bottom:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
h2{font-family:var(--mincho);font-weight:700;font-size:1.15rem;margin:0;text-wrap:balance;letter-spacing:.04em}
.eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--sub);font-weight:700}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px}

/* today */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--kin);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font-family:var(--mincho);font-weight:800;font-size:22px}
.stats{display:grid;gap:4px;min-width:0}
.stats b{font-variant-numeric:tabular-nums}
.big-btn{display:block;width:100%;border:0;border-radius:12px;background:var(--ai);color:var(--onai);padding:15px 16px;font-weight:700;font-size:1.05rem;cursor:pointer;text-align:left}
.big-btn span{display:block;font-weight:500;font-size:.8rem;opacity:.85}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-btn{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:11px;font-weight:700;cursor:pointer}

.group-title{display:flex;align-items:baseline;gap:10px}
.group-title .kan{font-family:var(--mincho);font-size:1.6rem;font-weight:800;color:var(--ai);line-height:1}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px;min-width:0}
.cat .nm{font-weight:700;font-size:.95rem}
.cat .meta{font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--kin);border-radius:999px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--sub);cursor:pointer}
nav.tabs button .g{font-family:var(--mincho);font-size:1.25rem;font-weight:800;line-height:1.2}
nav.tabs button[aria-current="page"]{color:var(--ai)}
nav.tabs button[aria-current="page"] .g{color:var(--kin)}

/* learn */
details.lesson{background:var(--sheet);border:1px solid var(--line);border-radius:12px}
details.lesson summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson summary::after{content:"＋";color:var(--kin)}
details.lesson[open] summary::after{content:"－"}
.lesson .body{padding:0 16px 16px;font-size:.93rem}
.lesson .body p{margin:.4em 0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.tbl th{color:var(--sub);font-weight:700;font-size:.78rem;white-space:nowrap}
.mc{font-family:var(--mincho)}
.em{color:var(--ng);font-weight:700}
.key{background:var(--kin-soft);padding:0 4px;border-radius:4px}

/* kanbun vertical */
.kbbox{overflow-x:auto;display:flex;justify-content:center;padding:6px 0}
.kb{-webkit-writing-mode:vertical-rl;writing-mode:vertical-rl;font-family:var(--mincho);font-weight:700;font-size:2rem;line-height:2.6;max-height:9.5em;letter-spacing:.12em}
.kb.small{font-size:1.5rem}
.kc{position:relative;display:inline-block;padding-block:.06em;border-radius:6px;cursor:default;user-select:none}
.kc.tap{cursor:pointer}
.kc.tap:hover{background:var(--ai-soft)}
.kc .mk{position:absolute;left:-.42em;bottom:-.12em;font-size:.4em;color:var(--ng);letter-spacing:0;font-weight:800}
.kc .no{position:absolute;right:-.62em;top:.05em;font-size:.38em;letter-spacing:0;font-family:var(--goth);font-weight:700;color:var(--onai);background:var(--ai);border-radius:999px;width:1.5em;height:1.5em;line-height:1.5em;text-align:center;-webkit-writing-mode:horizontal-tb;writing-mode:horizontal-tb}
.kc.done{color:var(--sub)}
.kc.oki{color:var(--sub);opacity:.55}
.kc.bad .no{background:var(--ng)}
.kc.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateY(-3px)}75%{transform:translateY(3px)}}

/* quiz overlay */
#quiz{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.qhead{display:flex;align-items:center;gap:12px;padding-block:12px}
.qhead .x{border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--sub);padding:0 4px}
.qhead .bar{flex:1;height:8px}
.qhead .cnt{font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums}
.qcat{font-size:.75rem;font-weight:700;color:var(--kin);letter-spacing:.1em}
.qtext{font-size:1.12rem;font-weight:500;margin:.3em 0 .8em}
.qtext .mcbig{font-family:var(--mincho);font-weight:800;font-size:1.9rem;display:block;margin:.2em 0;color:var(--ai)}
.qtext .quote{font-family:var(--mincho);font-size:1.15rem;display:block;background:var(--sheet);border-left:3px solid var(--kin);padding:8px 12px;margin:.5em 0;border-radius:0 8px 8px 0}
.choices{display:grid;gap:10px}
.ch{border:1.5px solid var(--line);background:var(--sheet);border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer;font-size:1rem;display:flex;gap:10px;align-items:flex-start}
.ch .lb{font-family:var(--mincho);font-weight:800;color:var(--sub);min-width:1.2em}
.ch.ok{border-color:var(--ok);background:var(--ok-soft)}
.ch.ng{border-color:var(--ng);background:var(--ng-soft)}
.ch[disabled]{cursor:default}
.fb{margin-top:14px;border-radius:12px;padding:14px;font-size:.93rem}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb .v{font-weight:800;font-size:1.05rem;margin-bottom:4px}
.fb.ok .v{color:var(--ok)} .fb.ng .v{color:var(--ng)}
.next{margin-top:14px}
.result{text-align:center;display:grid;gap:14px;padding-top:24px;padding-bottom:24px}
.result .score{font-family:var(--mincho);font-size:3.4rem;font-weight:800;color:var(--ai);line-height:1}
.result ul{text-align:left;margin:0;padding-left:1.2em;font-size:.9rem}

/* cards */
.decks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.deck{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;white-space:nowrap;cursor:pointer}
.deck[aria-pressed="true"]{background:var(--ai);color:var(--onai);border-color:var(--ai)}
.flash{min-height:260px;border-radius:16px;background:var(--sheet);border:1px solid var(--line);display:grid;justify-items:center;align-content:center;text-align:center;padding:24px 18px;cursor:pointer;gap:10px}
.flash .front{font-family:var(--mincho);font-weight:800;font-size:2rem;color:var(--ai);line-height:1.4;text-wrap:balance}
.flash .front.long{font-size:1.2rem;font-weight:700}
.flash .back{font-size:1rem}
.flash .back .mean{font-weight:700;font-size:1.2rem}
.flash .back .ex{font-family:var(--mincho);color:var(--sub);font-size:.92rem;margin-top:6px}
.flash .hint{font-size:.75rem;color:var(--sub)}
.poem{font-family:var(--mincho);-webkit-writing-mode:vertical-rl;writing-mode:vertical-rl;font-size:1.25rem;line-height:1.9;margin:0 auto;max-height:12em;font-weight:700}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardbtns .sub-btn.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cardbtns .sub-btn.again{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--sub)}
.speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.8rem;cursor:pointer}

/* weak list */
.weak li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.weak ul{list-style:none;margin:0;padding:0}
.weak .w{color:var(--ng);font-weight:700;font-size:.8rem;white-space:nowrap}
.empty{color:var(--sub);text-align:center;padding:20px 0;font-size:.9rem}
.note{font-size:.78rem;color:var(--sub)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (min-width:740px){
  .wrap,nav.tabs .in{max-width:820px}
  body{font-size:17px}
  .cats{grid-template-columns:repeat(4,1fr)}
  .row-btns{grid-template-columns:1fr 1fr}
  #quiz .wrap{max-width:680px}
  .kb{font-size:2.6rem}.kb.small{font-size:2rem}
  .flash{min-height:340px}.flash .front{font-size:2.6rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div class="brand">古文漢文ドリル<small>中学</small></div>
  <div class="streak" id="streak">連続 0日</div>
</div>
<div class="wrap grades" role="group" aria-label="学年を選ぶ">
  <button data-g="1">中1</button><button data-g="2">中2</button><button data-g="3">中3</button><button data-g="0">全学年</button>
</div></header>

<main>
  <section id="v-home" class="wrap"></section>
  <section id="v-learn" class="wrap" hidden></section>
  <section id="v-cards" class="wrap" hidden></section>
  <section id="v-weak" class="wrap" hidden></section>
</main>

<nav class="tabs" aria-label="メニュー"><div class="in">
  <button data-v="home" aria-current="page"><span class="g">今</span>今日</button>
  <button data-v="learn"><span class="g">要</span>要点</button>
  <button data-v="cards"><span class="g">札</span>単語カード</button>
  <button data-v="weak"><span class="g">苦</span>苦手・記録</button>
</div></nav>

<div id="quiz" hidden></div>
<div id="errbox" hidden style="position:fixed;left:8px;right:8px;bottom:90px;z-index:99;background:#A8343B;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5"></div>
<script>
var APP_VER="2026-11-08d";
window.onerror=function(msg,src,line,col){var b=document.getElementById("errbox");if(!b)return;b.hidden=false;
  b.textContent="エラーが起きました（この画面を写真に撮って送ってください）："+msg+" ／ "+line+"行 ／ 版 "+APP_VER+" ／ "+navigator.userAgent;};
</script>

<script>
/* ===================== データ ===================== */
const KOGO=[
["いと","とても・たいそう","いと幼ければ、籠に入れて養ふ。（竹取物語）"],
["をかし","趣がある・おもしろい","雨など降るもをかし。（枕草子）"],
["あはれなり","しみじみとした趣がある","夕日のさして…いとあはれなり。（枕草子）"],
["うつくし","かわいらしい","三寸ばかりなる人、いとうつくしうてゐたり。（竹取物語）"],
["つきづきし","似つかわしい・ふさわしい","炭もて渡るも、いとつきづきし。（枕草子）"],
["あやし","不思議だ／身分が低い","あやしがりて、寄りて見るに（竹取物語）"],
["いみじ","はなはだしい・すばらしい・ひどい","いみじう泣く。"],
["おどろく","はっと気づく・目を覚ます","風の音にぞおどろかれぬる（古今和歌集）"],
["ありがたし","めったにない・珍しい","ありがたきもの。舅にほめらるる婿。（枕草子）"],
["めでたし","すばらしい・立派だ","めでたく書きたる物語。"],
["ゆかし","見たい・知りたい・聞きたい","ゆかしかりしかど、神へ参るこそ本意なれ（徒然草）"],
["なつかし","心ひかれる・親しみやすい","なつかしき人。"],
["つれづれなり","することがなく退屈だ","つれづれなるままに、日暮らし（徒然草）"],
["やうやう","だんだん・しだいに","やうやう白くなりゆく山ぎは（枕草子）"],
["さらなり","言うまでもない","夏は夜。月のころはさらなり。（枕草子）"],
["げに","本当に・なるほど","げに、さもあらむ。"],
["いとほし","気の毒だ・かわいそうだ","いとほしと思ふ。"],
["かなし","いとしい・かわいい／悲しい","かなしき子。"],
["あさまし","驚きあきれる","あさましきこと。"],
["ののしる","大騒ぎする・評判になる","世の中ののしりけり。"],
["すさまじ","興ざめだ・殺風景だ","すさまじきもの。昼ほゆる犬。（枕草子）"],
["わろし","よくない・みっともない","火桶の火も白き灰がちになりてわろし。（枕草子）"],
["あらまほし","理想的だ・望ましい","少しのことにも、先達はあらまほしきことなり。（徒然草）"],
["ゐる","座る・じっとしている","いとうつくしうてゐたり。（竹取物語）"],
["つとめて","早朝／翌朝","冬はつとめて。（枕草子）"],
["よろづ","さまざまなこと・すべて","野山にまじりて竹を取りつつ、よろづのことに使ひけり。（竹取物語）"],
["のたまふ","おっしゃる（「言ふ」の尊敬語）","かぐや姫のたまふ。"],
["まうづ","参上する・お参りする（謙譲語）","石清水に詣でけり。"],
["はべり","あります・おります（丁寧語）","かかることなむはべりし。"],
["たまふ","お与えになる／〜なさる（尊敬語）","御文を書き置きたまふ。"],
["うし","つらい・いやだ","世の中をうしとやさしと思へども（万葉集）"],
["さうざうし","物足りない・さびしい","さうざうしき心地す。"],
["やがて","そのまま／すぐに","やがて出で立ちぬ。"],
["としごろ","長年・数年来","としごろ思ひつること。"],
["あまた","たくさん・多く","女御・更衣あまたさぶらひたまひける中に（源氏物語）"],
["かたち","容貌・顔立ち","この児のかたちのけうらなること（竹取物語）"],
["ことわり","道理・当然のこと","盛者必衰のことわりをあらはす（平家物語）"],
["にほふ","美しく照り映える","にほふがごとく今盛りなり（万葉集）"],
["おほかた","だいたい／まったく（〜ない）","おほかた見えず。"],
["いふかひなし","どうしようもない・つまらない","いふかひなきこと。"]
];

const KANA=[
["いふ","いう",["いぶ","ゆう","いお"],"語頭以外の「は・ひ・ふ・へ・ほ」→「わ・い・う・え・お」"],
["あはれ","あわれ",["あばれ","あうれ","あいれ"],"語頭以外の「は」→「わ」"],
["おもふ","おもう",["おもぶ","おもお","おもい"],"語頭以外の「ふ」→「う」"],
["かほ","かお",["かう","かぼ","こお"],"語頭以外の「ほ」→「お」"],
["いはく","いわく",["いばく","いあく","ゆわく"],"語頭以外の「は」→「わ」"],
["ゐなか","いなか",["うなか","えなか","わなか"],"「ゐ」→「い」"],
["こゑ","こえ",["こい","こわ","こう"],"「ゑ」→「え」"],
["をかし","おかし",["うかし","わかし","よかし"],"「を」→「お」（助詞の「を」以外）"],
["はぢ","はじ",["はち","わじ","はぎ"],"「ぢ」→「じ」"],
["よろづ","よろず",["よろつ","よろぞ","よろじ"],"「づ」→「ず」"],
["やうやう","ようよう",["やあやあ","よおよお","ゆうゆう"],"「au」の音→「ô」（やう→よう）"],
["まうす","もうす",["まおす","みょうす","もおす"],"「au」の音→「ô」（まう→もう）"],
["かうべ","こうべ",["かおべ","こおべ","きょうべ"],"「au」の音→「ô」（かう→こう）"],

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function pick(pool,correct,n=3){return shuffle([...new Set(pool)].filter(x=>x!==correct)).slice(0,n)}

function parseKb(s){const t=[];let oki=false;for(let i=0;i<s.length;i++){const c=s[i];
  if(c==="*"){oki=true;continue}
  if(c==="["){const j=s.indexOf("]",i);t[t.length-1].m=s.slice(i+1,j);i=j;continue}
  if("、。".includes(c)){t.push({c,p:1});continue}
  t.push({c,m:"",oki});oki=false}return t}
function kbOrder(t){const out=[],st=[],need={"二":"一","三":"二","下":"上","中":"上"};
  t.forEach((x,i)=>{if(x.p)return;const m=x.m;
    if(m==="レ"){st.push({i,n:"next"});return}
    if(need[m]){st.push({i,n:need[m]});return}
    out.push(i);let lab=m;
    while(st.length){const top=st[st.length-1];
      if(top.n==="next"||top.n===lab){st.pop();out.push(top.i);lab=t[top.i].m==="レ"?"":t[top.i].m}else break}
  });return out.filter(i=>!t[i].oki)}

function record(id,ok){const t=today(),r=S.srs[id]||{b:0,d:t,w:0,c:0};
  if(ok){r.b=Math.min(r.b+1,6);r.c++}else{r.b=1;r.w++}
  r.d=t+(ok?INTERVAL[r.b]:0);S.srs[id]=r;
  const dk=String(t);S.days[dk]=S.days[dk]||{n:0,c:0};S.days[dk].n++;if(ok)S.days[dk].c++;save()}
function streak(){let t=today(),n=0;if(!S.days[t])t--;while(S.days[t]){n++;t--}return n}
const isDue=q=>{const r=S.srs[q.id];return r&&r.d<=today()};
const mastered=q=>((S.srs[q.id]||{}).b||0)>=3;
const isWeak=q=>{const r=S.srs[q.id];return r&&r.w>0&&r.b<3};

function buildSet(pool,n=10){
  const due=shuffle(pool.filter(isDue)).sort((a,b)=>S.srs[a.id].b-S.srs[b.id].b);
  const fresh=shuffle(pool.filter(q=>!S.srs[q.id]));
  let set=[...due.slice(0,Math.ceil(n*.6)),...fresh].slice(0,n);
  if(set.length<n)set=[...set,...due.slice(Math.ceil(n*.6))].slice(0,n);
  if(set.length<n){const rest=shuffle(pool.filter(q=>!set.includes(q))).sort((a,b)=>((S.srs[a.id]||{}).b||0)-((S.srs[b.id]||{}).b||0));set=[...set,...rest].slice(0,n)}
  return shuffle(set)}
function dailySet(){const fresh=[];const byCat=CATS.map(c=>shuffle(QG().filter(q=>q.cat===c.id&&!S.srs[q.id])));
  for(let k=0;fresh.length<10&&k<20;k++)byCat.forEach(a=>{if(a[k])fresh.push(a[k])});
  const due=shuffle(QG().filter(isDue)).sort((a,b)=>S.srs[a.id].b-S.srs[b.id].b);
  let set=[...due.slice(0,6),...shuffle(fresh)].slice(0,10);
  if(set.length<10)set=[...set,...due.slice(6)].slice(0,10);
  if(set.length<10)set=[...set,...shuffle(QG().filter(q=>!set.includes(q)))].slice(0,10);
  return shuffle(set)}

  ["古","古文を読むコツ",[2,3],`<p><b>主語が省略される</b>：敬語（のたまふ＝おっしゃる、たまふ＝〜なさる）が付いていれば身分の高い人が主語。</p>

  <p><b>一・二点</b>：二字以上離れた上の字に返る。</p>${ex("有[レ]朋自[二]遠方[一]来")}

  <p><b>対句</b>：律詩は第三・四句、第五・六句を対句にする。</p>`],
  ["漢","故事成語",[1],`<div class="tbl"><table><tr><th>故事成語</th><th>意味</th><th>出典</th></tr>
  ${KOJI.filter((k,i)=>!S.grade||kojiGr(i)===S.grade).map(k=>`<tr><td class="mc">${k[0]}</td><td>${k[2]}</td><td>${k[3]}</td></tr>`).join("")}</table></div>`]
  ];
  document.getElementById("v-learn").innerHTML=`<h2>要点まとめ（${GNAME[S.grade]}）</h2><p class="note" style="margin:0">テスト前はここを読んでから、今日のおすすめ問題で確認しよう。</p>`+
  ["古","漢"].map(g=>`<div class="group-title"><span class="kan">${g==="古"?"古文":"漢文"}</span></div>`+L.filter(l=>l[0]===g&&(!S.grade||l[2].includes(S.grade))).map(l=>`<details class="lesson"><summary><span>${l[1]}</span><span class="gchip">${l[2].length===3?"中1〜3":l[2].map(n=>"中"+n).join("・")}</span></summary><div class="body">${l[3]}</div></details>`).join("")).join("");
}

/* ===================== 単語カード ===================== */
/* 読み上げ：歴史的仮名遣い→現代の発音に直してから読む */
function modern(s){
  const OV={"いふかひなし":"いうかいなし","のたまふ":"のたまう","たまふ":"たまう"};if(OV[s])return OV[s];
  s=s.replace(/ゐ/g,"い").replace(/ゑ/g,"え").replace(/を/g,"お").replace(/ぢ/g,"じ").replace(/づ/g,"ず");
  const H={"は":"わ","ひ":"い","ふ":"う","へ":"え","ほ":"お"};
  s=s.split("").map((c,i,a)=>i>0&&!"、。 \n".includes(a[i-1])&&H[c]?H[c]:c).join("");
  const A={"か":"こ","さ":"そ","ざ":"ぞ","た":"と","だ":"ど","な":"の","は":"ほ","ば":"ぼ","ま":"も","や":"よ","ら":"ろ","わ":"お","あ":"お","が":"ご"};
  const I={"き":"きゅ","し":"しゅ","ち":"ちゅ","い":"ゆ","り":"りゅ","ぎ":"ぎゅ","じ":"じゅ","に":"にゅ"};
  const E={"け":"きょ","せ":"しょ","て":"ちょ","ね":"にょ","へ":"ひょ","め":"みょ","れ":"りょ","え":"よ","げ":"ぎょ","ぜ":"じょ"};
  return s.replace(/([かさざただなはばまやらわあが])う/g,(m,c)=>A[c]+"う").replace(/([きしちいりぎじに])う/g,(m,c)=>I[c]+"う").replace(/([けせてねへめれえげぜ])う/g,(m,c)=>E[c]+"う")}
const OPEN_YOMI={"竹取物語":"今は昔、竹取の翁というものありけり。","土佐日記":"男もすなる日記というものを、女もしてみんとてするなり。","枕草子":"春はあけぼの。ようよう白くなりゆく山ぎわ、少しあかりて、紫だちたる雲の細くたなびきたる。","源氏物語":"いずれのおおんときにか、にょうご、こうい、あまたさぶらいたまいける中に、","方丈記":"ゆく河の流れは絶えずして、しかももとの水にあらず。","平家物語":"祇園精舎の鐘の声、諸行無常の響きあり。","徒然草":"つれづれなるままに、ひぐらし、すずりに向かいて、心にうつりゆくよしなしごとを、そこはかとなく書きつくれば、","おくのほそ道":"月日は、はくたいのかかくにして、行きかう年もまた旅人なり。"};
const KS_FIX=[["烽火三月","ほうかさんげつ"],["煙花三月","えんかさんがつ"],["今春看又過ぐ","こんしゅんみすみすすぐ"],["牀前","しょうぜん"],["処処","しょしょ"],["啼鳥","ていちょう"],["春眠","しゅんみん"],["夜来","やらい"],["風雨","ふうう"],["多少","たしょう"],["看る","みる"],["山月","さんげつ"],["低れて","たれて"],["江碧","こうへき"],["逾よ","いよいよ"],["然えん","もえん"],["欲す","ほっす"],["何れ","いずれ"],["帰年","きねん"],["故人","こじん"],["辞し","じし"],["揚州","ようしゅう"],["孤帆","こはん"],["遠影","えんえい"],["碧空","へきくう"],["天際","てんさい"],["渭城","いじょう"],["朝雨","ちょうう"],["軽塵","けいじん"],["浥す","うるおす"],["客舎","かくしゃ"],["青青","せいせい"],["柳色","りゅうしょく"],["一杯","いっぱい"],["陽関","ようかん"],["山河","さんが"],["城春","しろはる"],["草木","そうもく"],["濺ぎ","そそぎ"],["家書","かしょ"],["万金","ばんきん"],["抵たる","あたる"],["白頭","はくとう"],["搔けば","かけば"],["渾べて","すべて"],["簪","しん"],["勝えざらん","たえざらん"]];
const ksSay=p=>KS_FIX.reduce((t,[a,b])=>t.split(a).join(b),modern(p.k.join("。")));
const DECKS={
 kogo:{nm:"古語",cards:KOGO.map(([w,m,ex],i)=>({id:"c-kogo"+i,gr:+G_KOGO[i],f:w,b:`<div class="mean">${m}</div><div class="ex">${esc(ex)}</div>`,say:modern(w)}))},
 koji:{nm:"故事成語",cards:KOJI.map(([w,r,m,src,st],i)=>({id:"c-koji"+i,gr:kojiGr(i),f:w,b:`<div class="note">${r}</div><div class="mean">${m}</div><div class="ex">『${src}』${st}</div>`}))},
 open:{nm:"冒頭文",cards:WORKS.filter(w=>w.o).map((w,i)=>({id:"c-open"+i,gr:WGR[w.t],f:w.o,long:1,b:`<div class="mean">『${w.t}』</div><div class="ex">${w.a}・${w.e}・${w.g}</div>`,say:OPEN_YOMI[w.t]||w.o}))},
 kanshi:{nm:"漢詩",cards:KANSHI.map((p,i)=>({id:"c-ks"+i,gr:+G_KANSHI[i],f:`「${p.t}」`,long:p.t.length>6?1:0,b:`<div class="note">${p.a}・${p.f}</div><div class="poem">${p.k.join("<br>")}</div>`,say:ksSay(p)}))},
 kana:{nm:"仮名遣い",cards:KANA.map(([h,m,_,r],i)=>({id:"c-kana"+i,gr:1,f:h,b:`<div class="mean">${m}</div><div class="ex">${r}</div>`}))}
};
let CS={deck:"kogo",onlyNew:true,i:0,flip:false,order:[]};
const deckCards=k=>DECKS[k].cards.filter(inG);
function deckList(){let c=deckCards(CS.deck);if(CS.onlyNew){const u=c.filter(x=>!S.known[x.id]);if(u.length)c=u}return c}
function resetDeck(){CS.order=shuffle(deckList());CS.i=0;CS.flip=false}
let JA=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();JA=v.find(x=>/^ja/i.test(x.lang))||null}catch(e){}}
try{loadVoices();speechSynthesis.addEventListener("voiceschanged",loadVoices)}catch(e){}
function speak(text,btn){
  const msg=t=>{const m=document.getElementById("saymsg");if(m)m.textContent=t};
  if(!("speechSynthesis" in window)){msg("この端末・ブラウザは読み上げに対応していません。");return}
  const ss=speechSynthesis;
  if(btn.dataset.on){ss.cancel();btn.dataset.on="";btn.textContent="読み上げ";return}
  if(ss.speaking||ss.pending)ss.cancel();
  if(!JA)loadVoices();
  const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";if(JA)u.voice=JA;u.rate=.85;
  let started=false;
  u.onstart=()=>{started=true;btn.dataset.on="1";btn.textContent="停止";msg("")};
  u.onend=()=>{btn.dataset.on="";btn.textContent="読み上げ"};
  u.onerror=e=>{btn.dataset.on="";btn.textContent="読み上げ";if(e.error!=="canceled"&&e.error!=="interrupted")msg("読み上げできませんでした（"+e.error+"）。")};
  try{ss.resume()}catch(e){}
  ss.speak(u);
  btn.textContent="準備中…";
  setTimeout(()=>{if(!started){btn.textContent="読み上げ";msg("音が出ないときは、マナーモード（消音スイッチ）を切って音量を上げてから、もう一度押してください。")}},2500);
}
function renderCards(){
  const avail=Object.keys(DECKS).filter(k=>deckCards(k).length);
  if(!avail.includes(CS.deck)){CS.deck=avail[0];CS.order=[]}
  if(!CS.order.length)resetDeck();
  const dc=deckCards(CS.deck),known=dc.filter(c=>S.known[c.id]).length,c=CS.order[CS.i];
  document.getElementById("v-cards").innerHTML=`<h2>単語カード（${GNAME[S.grade]}）</h2>
  <div class="decks">${Object.entries(DECKS).filter(([k])=>avail.includes(k)).map(([k,v])=>`<button class="deck" data-d="${k}" aria-pressed="${k===CS.deck}">${v.nm}</button>`).join("")}</div>
  <div class="toggle"><input type="checkbox" id="onlynew" ${CS.onlyNew?"checked":""}><label for="onlynew">覚えていないカードだけ</label><span style="margin-left:auto">覚えた ${known}/${dc.length}</span></div>
  <div class="bar"><i style="width:${known/dc.length*100}%"></i></div>
  ${c?`<div class="flash" id="flash" role="button" tabindex="0" aria-label="カードをめくる">
    <div class="front${c.long?" long":""}">${c.f}</div>
    ${CS.flip?`<div class="back">${c.b}</div>`:`<div class="hint">タップして答えを見る</div>`}
    ${c.say?`<button class="speak" id="say" type="button">読み上げ</button><div class="note" id="saymsg" aria-live="polite"></div>`:""}
  </div>
  <div class="note" style="text-align:center">${CS.i+1} / ${CS.order.length}</div>
  <div class="cardbtns"><button class="sub-btn again" id="c-again">まだ</button><button class="sub-btn good" id="c-good">覚えた</button></div>`:
  `<div class="sheet empty">このデッキは全部覚えました。<br><button class="sub-btn" id="c-reset" style="margin-top:10px">覚えた記録を消して最初から</button></div>`}`;
  document.querySelectorAll(".deck").forEach(b=>b.onclick=()=>{CS.deck=b.dataset.d;resetDeck();renderCards()});
  document.getElementById("onlynew").onchange=e=>{CS.onlyNew=e.target.checked;resetDeck();renderCards()};
  const f=document.getElementById("flash");
  if(f){const flip=()=>{CS.flip=!CS.flip;renderCards()};f.onclick=e=>{if(!e.target.closest("#say,#saymsg")){try{speechSynthesis.cancel()}catch(_){}flip()}};f.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
    const sy=document.getElementById("say");if(sy)sy.onclick=e=>{e.stopPropagation();speak(c.say,sy)};
    const next=()=>{CS.i++;CS.flip=false;if(CS.i>=CS.order.length)resetDeck();renderCards()};
    document.getElementById("c-good").onclick=()=>{S.known[c.id]=1;save();next()};
    document.getElementById("c-again").onclick=()=>{delete S.known[c.id];save();CS.order.push(c);next()};}
  const rs=document.getElementById("c-reset");if(rs)rs.onclick=()=>{dc.forEach(x=>delete S.known[x.id]);save();resetDeck();renderCards()};
}

/* ===================== 苦手・記録 ===================== */
let confirmReset=false;
function renderWeak(){
  const weak=QG().filter(isWeak).sort((a,b)=>S.srs[b.id].w-S.srs[a.id].w);
  const t=today(),days=[];for(let k=6;k>=0;k--){const d=S.days[t-k]||{n:0,c:0};days.push(Object.assign({k:k},d))}
  const max=Math.max(GOAL,...days.map(d=>d.n));
  const dn=["日","月","火","水","木","金","土"];
  const bars=days.map((d,j)=>{const x=12+j*44,h=d.n/max*90,dt=new Date((t-d.k)*864e5);
    return `<rect x="${x}" y="${110-h}" width="28" height="${h}" rx="4" fill="var(--kin)"/><rect x="${x}" y="${110-d.c/max*90}" width="28" height="${d.c/max*90}" rx="4" fill="var(--ai)"/>
    <text x="${x+14}" y="128" text-anchor="middle" font-size="11" fill="var(--sub)">${dn[dt.getUTCDay()]}</text>${d.n?`<text x="${x+14}" y="${104-h}" text-anchor="middle" font-size="11" fill="var(--ink)">${d.n}</text>`:""}`}).join("");
  const gy=110-GOAL/max*90;
  const tot=Object.values(S.days).reduce((a,d)=>({n:a.n+d.n,c:a.c+d.c}),{n:0,c:0});
  document.getElementById("v-weak").innerHTML=`<h2>苦手・記録</h2>
  <div class="sheet"><div class="eyebrow">この7日間（金＝解いた数・藍＝正解数）</div>
   <svg viewBox="0 0 320 136" style="width:100%;height:auto;display:block;margin-top:6px" role="img" aria-label="7日間の学習量">
   <line x1="6" x2="314" y1="${gy}" y2="${gy}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="314" y="${gy-4}" text-anchor="end" font-size="10" fill="var(--sub)">目標${GOAL}</text>${bars}</svg>
   <div class="note">これまでに ${tot.n}問 解いて正答率 ${tot.n?Math.round(tot.c/tot.n*100):0}%・連続 ${streak()}日</div></div>
  <div class="sheet weak"><div class="eyebrow">苦手な問題（${weak.length}）</div>
   ${weak.length?`<ul>${weak.slice(0,40).map(q=>`<li><span>${esc(q.label)}</span><span class="w">×${S.srs[q.id].w}</span></li>`).join("")}</ul>
   <button class="big-btn" id="w-go" style="margin-top:12px">苦手を復習する（${Math.min(weak.length,15)}問）</button>`:`<div class="empty">まだ苦手な問題はありません。<br>間違えた問題がここにたまり、3回続けて正解すると消えます。</div>`}</div>
  <div class="sheet"><div class="eyebrow">データ</div><p class="note">学習記録はこの端末のブラウザに保存されます。（アプリの版：${APP_VER}）</p>
   <div class="confirm">${confirmReset?`<span>本当に全部消しますか？</span><button class="sub-btn" id="rs-yes" style="color:var(--ng)">消す</button><button class="sub-btn" id="rs-no">やめる</button>`:`<button class="sub-btn" id="rs">学習記録をリセット</button>`}</div></div>`;
  const g=document.getElementById("w-go");if(g)g.onclick=()=>startQuiz(shuffle(weak).slice(0,15),"苦手の復習");
  const r=document.getElementById("rs");if(r)r.onclick=()=>{confirmReset=true;renderWeak()};
  const y=document.getElementById("rs-yes");if(y)y.onclick=()=>{S={srs:{},days:{},known:{},grade:S.grade};save();confirmReset=false;renderAll()};
  const n=document.getElementById("rs-no");if(n)n.onclick=()=>{confirmReset=false;renderWeak()};
}

/* ===================== ナビ ===================== */
let VIEW="home";
function showView(v){VIEW=v;["home","learn","cards","weak"].forEach(k=>document.getElementById("v-"+k).hidden=k!==v);
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));
  renderAll();window.scrollTo(0,0)}
function renderAll(){renderHome();if(VIEW==="learn")renderLearn();if(VIEW==="cards")renderCards();if(VIEW==="weak")renderWeak()}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>showView(b.dataset.v));
function paintGrade(){document.querySelectorAll(".grades button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.g===S.grade)))}
document.querySelectorAll(".grades button").forEach(b=>b.onclick=()=>{S.grade=+b.dataset.g;save();CS.order=[];paintGrade();renderAll()});
paintGrade();
renderLearn();renderAll();
</script>
